# The web version on GitHub Pages: builds web/dist (the app's pages + server.js for the browser) and publishes it.
# Runs on every push to main, and on weekdays after the CNB publishes the day's exchange rates.
name: Web version (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build tools
        run: npm i --prefix web --no-save --no-audit --no-fund esbuild@0.25.0 buffer@6.0.3 path-browserify@1.0.1
      - name: Build the web version
        run: node web/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
